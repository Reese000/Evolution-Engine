  #   environment:
  #     - EE_USE_GPU=true
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   profiles:
  #     - gpu

  # ── Prometheus metrics exporter (optional) ────────────────────────
  prometheus-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "false"
    container_name: evolution-prometheus
    restart: unless-stopped
    command: ["python", "-m", "metrics_export"]
    ports:
      - "${EE_PROMETHEUS_PORT:-9100}:9100"
    environment:
      - EE_PROMETHEUS_PORT=9100
    profiles:
      - monitoring
    depends_on:
      evolution-engine:
        condition: service_started

